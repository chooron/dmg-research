# =============================================================================
formula_id: corrected_candidate_E_S0
structure_training: confidence_weighted_counterfactual_BCE
experiment_id: E4
variant: SSH-2x2
basin_manifest: /root/autodl-fs/data/531sub_id.txt
basin_count: 531
preserve_phy_model: true
# Flex-MOPEX SSH 2x2 factorial ablation (Pure-X35, 531 basins, 10 epochs)
# 
# Method: Counterfactual Structural Learning with Pure-Attribute Nonlinear Structure Encoder
# - Architecture: LearnedStructureNetPureAttrEncoder x35 -> 35->128->64->8
# - Supervision: Basin-specific Counterfactual Supervision (DeltaJ = J_OFF - J_ON)
# - Soft-target: q = sigmoid(DeltaJ / T) with process-wise robust median scale T
# - Confidence-weighting: c = 2 * |q - 0.5| (normalized per process)
# - Optimization: Single Unified Adadelta (lr=1.0) over all 16 parameter tensors
# - Gradient isolation: Fit/AIC -> structure-gate blocked; L_CF -> backbone blocked
# =============================================================================

defaults:
  - _self_
  - hydra: settings
  - observations: camels_531 # formal canonical manifest: data/531sub_id.txt

## General -------------------------------#
mode: train # train, test, train_test, simulation
random_seed: 42
device: cuda
gpu_id: 0

data_loader: HydroLoader
data_sampler: HydroSampler
trainer: CFTrainer
save_output: true
save_path: project/flexmopex/results/ssh_2x2/E4/seed_42/
trained_model: project/flexmopex/results/ssh_2x2/E4/seed_42/model/

## Training ------------------------------#
train:
  start_time: 1980/10/01
  end_time: 1995/09/30
  target: [streamflow]
  optimizer: Adadelta
  batch_size: 100
  epochs: 10
  start_epoch: 0
  save_epoch: 1
  learning_rate: 1.0
  lr_scheduler: None
  lr_scheduler_params:
    step_size: 10
    gamma: 0.5
  early_stopping:
    enabled: false
    monitor: train_loss
    mode: min
    min_epochs: 50
    patience: 20
    min_delta: 0.0001
## Evaluation -------------------------------#
test:
  start_time: 1995/10/01
  end_time: 2010/09/30
  batch_size: 100
  test_epoch: 10
  split_dataset: True

## Inference -------------------------------#
simulation:
  start_time: 2012/10/01
  end_time: 2014/09/30
  batch_size: 25

## Loss Function -------------------------#
loss_function:
  model: NseDynAicBatchLoss
  aic_alpha: 0.007

## Counterfactual Supervision ----------------#
counterfactual_supervision: true
confidence_weighted_cf_loss: true
cf_loss_weight: 1.0
structure_optimizer: none # Single Unified Adadelta optimizer across all parameters

## Differentiable Model -----------------------------#
delta_model:
  rho: 365

  phy_model:
    directory: project/flexmopex/models
    model: [LearnedWeightMopexE]
    nmul: 16
    warm_up: 365
    interception_semantics: S0
    disable_compile: false
    require_torch_compile: true
    warm_up_states: False
    dy_drop: 0.0
    counterfactual_supervision: true
    attributes: []
    use_log_norm: []
    nearzero: 1e-5
    forcings: [prcp, tmean, pet]

  nn_model:
    directory: project/flexmopex/models
    model: LearnedStructureNetPureAttrEncoder
    dr: 0.5
    hidden_size: 128

    forcings: [prcp, tmean, pet]
    attributes:
      [
        p_mean,
        pet_mean,
        p_seasonality,
        frac_snow,
        aridity,
        high_prec_freq,
        high_prec_dur,
        low_prec_freq,
        low_prec_dur,
        elev_mean,
        slope_mean,
        area_gages2,
        frac_forest,
        lai_max,
        lai_diff,
        gvf_max,
        gvf_diff,
        dom_land_cover_frac,
        dom_land_cover,
        root_depth_50,
        soil_depth_pelletier,
        soil_depth_statsgo,
        soil_porosity,
        soil_conductivity,
        max_water_content,
        sand_frac,
        silt_frac,
        clay_frac,
        geol_1st_class,
        glim_1st_class_frac,
        geol_2nd_class,
        glim_2nd_class_frac,
        carbonate_rocks_frac,
        geol_porosity,
        geol_permeability,
      ]
