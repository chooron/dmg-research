[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrodiag"
version = "0.1.0"
description = "Hydrological model structure correctness diagnosis"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ablation*", "evotorch*", "models*", "optimization*", "training*", "manuscript", "manuscript.r3*", "manuscript.r4*", "manuscript.scripts*"]
namespaces = true
