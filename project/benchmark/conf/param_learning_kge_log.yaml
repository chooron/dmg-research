name: param_learning_kge_log

paths:
  data_path: /workspace/autoresearch/data/camels_dataset
  basin_ids_path: /workspace/autoresearch/project/benchmark/data/559sub_id.txt
  basin_ids_reference_path: /workspace/autoresearch/data/gage_id.npy
  output_dir: outputs/parameter_learning
  attributes_path: data/camels_attributes.parquet

camels:
  all_start_time: 1980-10-01
  all_end_time: 2014-09-30
  input_unit: ft3/s
  output_unit: mm/d
  area_name: area_gages2
  forcings: [prcp, tmean, pet]
  attributes:
    - p_mean
    - pet_mean
    - p_seasonality
    - frac_snow
    - aridity
    - high_prec_freq
    - high_prec_dur
    - low_prec_freq
    - low_prec_dur
    - elev_mean
    - slope_mean
    - area_gages2
    - frac_forest
    - lai_max
    - lai_diff
    - gvf_max
    - gvf_diff
    - dom_land_cover_frac
    - dom_land_cover
    - root_depth_50
    - soil_depth_pelletier
    - soil_depth_statsgo
    - soil_porosity
    - soil_conductivity
    - max_water_content
    - sand_frac
    - silt_frac
    - clay_frac
    - geol_1st_class
    - glim_1st_class_frac
    - geol_2nd_class
    - glim_2nd_class_frac
    - carbonate_rocks_frac
    - geol_porosity
    - geol_permeability

splits:
  train:
    start_time: 1989-01-01
    end_time: 1998-12-31
  test:
    start_time: 1999-01-01
    end_time: 2009-12-31

model:
  forcings: [prcp, tmean, pet]
  warm_up: 365
  warm_up_states: true
  nearzero: 1e-5
  backend: compile

train:
  objective: KGE_LOG
  loss_function:
    name: KgeLogBatchLoss
    kge_eps: 0.1
    global_eps: 1.0e-3
    eps_frac: 0.01       # per-basin eps = 1% of mean train obs
  epochs: 100
  lr: 1.0e-3
  seeds: [42, 123, 456, 789, 1234]
  grad_clip: 5.0
  log_interval: 10

model_nn:
  name: DeterministicParamModel
  hidden_size: 128
  output_activation: sigmoid

device: cuda
