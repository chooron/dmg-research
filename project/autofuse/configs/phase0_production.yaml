    batch_size: 100
    structures: [2, 8, 190, 214]
    test_eager: true
    test_compile: true
  p0_d_validation:
    enabled: true
    structures: [2, 8, 190, 214]
    eval_period: "evaluation"
    eval_days: 3652
    batch_size: 100
    candidate_eval_intervals: [100, 250, 500, 1000]
  p0_e_pilot:
    enabled: true
    batch_size: 100
    cycles: 2
    structures: "all"
  p0_f_synthesis:
    enabled: true
