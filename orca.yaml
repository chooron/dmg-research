# dmg-research Orca worktree setup
#
# Shared across all Orca worktrees:
#   - data/   -> primary checkout data/
#   - .venv/  -> primary checkout .venv/
#   - project/flexmopex/.env -> primary checkout local .env (only if it exists)
#
# NOT shared:
#   - results/
#   - outputs/
#   - checkpoints/
#   - logs/
#   - tmp/
#
# This repository is fixed in WSL at /home/jingxin/code/dmg-research.

scripts:
  setup: |
    set -e

    ROOT="/home/jingxin/code/dmg-research"

    echo "[orca] worktree: $(pwd)"
    echo "[orca] shared root: ${ROOT}"

    # Shared research data
    if [ ! -e data ] && [ ! -L data ]; then
      ln -s "${ROOT}/data" data
    fi

    # Shared Python environment (including PyTorch/CUDA dependencies)
    if [ ! -e .venv ] && [ ! -L .venv ]; then
      ln -s "${ROOT}/.venv" .venv
    fi

    # Flex-MOPEX local environment file, if present in the primary checkout.
    # The file remains gitignored and is not copied into Git.
    if [ -f "${ROOT}/project/flexmopex/.env" ]; then
      mkdir -p project/flexmopex
      if [ ! -e project/flexmopex/.env ] && [ ! -L project/flexmopex/.env ]; then
        ln -s "${ROOT}/project/flexmopex/.env" project/flexmopex/.env
      fi
    fi

    echo "[orca] data  -> $(readlink -f data 2>/dev/null || echo missing)"
    echo "[orca] .venv -> $(readlink -f .venv 2>/dev/null || echo missing)"